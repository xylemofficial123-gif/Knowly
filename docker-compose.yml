services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: knowledge_agent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ['5434:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  qdrant:
    image: qdrant/qdrant
    ports: ['6333:6333']
    volumes: [qdrant_data:/qdrant/storage]

volumes:
  postgres_data:
  qdrant_data:
